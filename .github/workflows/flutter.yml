name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  catalog:
    name: Catalog generator (100 + 100)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate and verify counts
        run: |
          python3 tool/generate_catalog.py
          test "$(grep -c 'Vehicle(' lib/data/vehicles_catalog.dart)" = "100"
          test "$(grep -c 'FarmerItem(' lib/data/farmer_items_catalog.dart)" = "100"
      - name: Fail if generated output drifted from committed
        run: git diff --exit-code lib/data functions/seed

  flutter:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.x"
          channel: stable
      - run: flutter create --platforms=android .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
