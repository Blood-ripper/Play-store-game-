<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FD3FF"/>
      <stop offset="1" stop-color="#CFF0A8"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE082"/>
      <stop offset="1" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8BC34A"/>
      <stop offset="1" stop-color="#558B2F"/>
    </linearGradient>
  </defs>

  <!-- rounded app-icon background -->
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>

  <!-- rolling field -->
  <path d="M0 360 Q128 300 256 350 T512 340 V512 H0 Z" fill="url(#grass)"/>
  <path d="M0 400 Q160 360 320 400 T512 390 V512 H0 Z" fill="#6DA63C" opacity="0.5"/>

  <!-- sun -->
  <g transform="translate(372,132)">
    <g fill="url(#sun)">
      <circle r="52"/>
    </g>
    <g stroke="#FFB300" stroke-width="10" stroke-linecap="round">
      <line x1="0" y1="-74" x2="0" y2="-92"/>
      <line x1="52" y1="-52" x2="66" y2="-66"/>
      <line x1="74" y1="0" x2="92" y2="0"/>
      <line x1="52" y1="52" x2="66" y2="66"/>
      <line x1="-52" y1="52" x2="-66" y2="66"/>
      <line x1="-74" y1="0" x2="-92" y2="0"/>
      <line x1="-52" y1="-52" x2="-66" y2="-66"/>
    </g>
    <circle r="34" fill="#6D4C41"/>
  </g>

  <!-- tractor -->
  <g transform="translate(150,300)">
    <rect x="-70" y="-18" width="26" height="56" rx="6" fill="#D32F2F"/>
    <rect x="-48" y="-30" width="92" height="52" rx="14" fill="#E53935"/>
    <rect x="-36" y="-22" width="40" height="36" rx="8" fill="#42A5F5"/>
    <circle cx="-30" cy="40" r="22" fill="#212121"/>
    <circle cx="-30" cy="40" r="9" fill="#616161"/>
    <circle cx="36" cy="44" r="30" fill="#212121"/>
    <circle cx="36" cy="44" r="12" fill="#616161"/>
  </g>

  <!-- title band -->
  <g transform="translate(256,452)">
    <rect x="-176" y="-30" width="352" height="60" rx="30" fill="#FF8F00"/>
    <text x="0" y="12" text-anchor="middle" font-family="Arial, sans-serif"
          font-weight="900" font-size="40" fill="#FFFFFF"
          letter-spacing="2">FARM RUSH</text>
  </g>
</svg>
